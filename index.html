
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凤儿老师的教学资源中心</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  color: #172b4d;
  background: #fff;
}
header {
  max-width: 1100px;
  margin: auto;
  padding: 25px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h2 { font-size: 21px; margin: 0; }
nav a {
  color: #475569;
  text-decoration: none;
  margin-left: 22px;
  font-size: 14px;
}
main {
  max-width: 1100px;
  margin: 55px auto;
  padding: 0 24px;
}
h1 { font-size: 36px; margin-bottom: 12px; }
.subtitle { color: #64748b; margin-bottom: 38px; }
.courses {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}
.course {
  border: 1px solid #e5eaf0;
  border-radius: 12px;
  padding: 28px;
  text-decoration: none;
  color: inherit;
  transition: .2s;
}
.course:hover {
  border-color: #3974b8;
  transform: translateY(-3px);
  box-shadow: 0 8px 24px #17365d12;
}
.course .number { color: #3974b8; font-size: 13px; }
.course h3 { margin: 13px 0; font-size: 21px; }
.course p { color: #64748b; font-size: 14px; line-height: 1.8; }
.enter { color: #2563eb; font-size: 14px; }
footer {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  padding: 35px 15px;
  border-top: 1px solid #eee;
}
@media(max-width:600px) {
  .courses { grid-template-columns: 1fr; }
  h1 { font-size: 29px; }
  nav a { margin-left: 10px; }
}
</style>
</head>
<body>

<header>
  <h2>凤儿老师的教学资源中心</h2>
  <nav>
    <a href="index.html">首页</a>
    <a href="#courses">课程</a>
  </nav>
</header>

<main>
  <h1>欢迎来到课程中心</h1>
  <p class="subtitle">分享知识 · 注重实践 · 鼓励创新</p>

  <section class="courses" id="courses">

    <a class="course" href="courses/machine-vision.html">
      <span class="number">COURSE 01</span>
      <h3>机器视觉</h3>
      <p>图像处理、特征提取、深度学习与项目实践。</p>
      <span class="enter">进入课程 →</span>
    </a>

    <a class="course" href="courses/stm32.html">
      <span class="number">COURSE 02</span>
      <h3>嵌入式（STM32）</h3>
      <p>STM32开发、外设驱动与综合项目实践。</p>
      <span class="enter">进入课程 →</span>
    </a>

    <a class="course" href="courses/51mcu.html">
      <span class="number">COURSE 03</span>
      <h3>嵌入式（51单片机）</h3>
      <p>单片机基础、C语言与硬件接口应用。</p>
      <span class="enter">进入课程 →</span>
    </a>

    <a class="course" href="courses/embedded-minor.html">
      <span class="number">COURSE 04</span>
      <h3>嵌入式微专业</h3>
      <p>智能感知、蓝牙小车与项目式实践。</p>
      <span class="enter">进入课程 →</span>
    </a>

  </section>
</main>

<footer>
  凤儿老师的教学资源中心 · 让学习更有趣，让实践更有价值
</footer>

</body>
</html>
